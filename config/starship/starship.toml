python_binary = ["python", "python3"]
detect_files = ["requirements.txt", "Pipfile", "pyproject.toml", "setup.py", "tox.ini", ".python-version"]
detect_extensions = ["py"]
detect_folders = [".venv", "venv", ".env"]
