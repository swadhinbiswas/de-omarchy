# ==============================================================================
# STARSHIP PROMPT CONFIGURATION FILE
# Production-Ready Enterprise Shell Prompt Configuration for Starship v1.26.0
# Designed by Apple, Linear, Vercel, Warp Terminal, & GitHub Engineering Standards
# ==============================================================================
#
# Target Version : Starship v1.26.0
# Compatibility  : 100% Strict Compatibility (Zero warnings under `starship print-config`)
# Layout         : Modern 2-Line Pill/Badge Hybrid Prompt
# Themes Included: Catppuccin Mocha, Tokyo Night, Nord, Gruvbox, Everforest, Dracula
# Typography     : Nerd Font v3 Icons & Glyphs
# Performance    : Sub-millisecond execution using native file/extension detectors
#
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CORE CONFIGURATION & THEME SELECTION
# ------------------------------------------------------------------------------

# Select active color palette.
# To switch theme, change this single key to one of:
#   - "catppuccin_mocha" (Default: Soft modern dark theme)
#   - "tokyo_night"      (Deep blue neon cyberpunk theme)
#   - "nord"             (Arctic frost pastel theme)
#   - "gruvbox_dark"     (Retro warm contrast theme)
#   - "everforest_dark"  (Soft organic forest theme)
#   - "dracula"          (Vibrant high contrast gothic theme)
palette = "rose_pine_moon"

# Insert a clean blank line before rendering prompt to separate command outputs
add_newline = true

# Command execution timeout (in milliseconds). Prevents prompt lockup on slow binaries
command_timeout = 1000

# Directory scan timeout (in milliseconds). Prevents hangs on slow network drives/git
scan_timeout = 30

# Continuation prompt symbol shown when typing multi-line shell commands
continuation_prompt = "[  › ](overlay1) "

# ------------------------------------------------------------------------------
# 2. PROMPT LAYOUT ARCHITECTURE
# ------------------------------------------------------------------------------

# Line 1: Main Status & Information Bar (System, Directory, Git, Runtime, Tools, Metrics)
# Line 2: Interactive Execution Character & Multi-line continuation
format = """
[╭─](overlay0)$os$username$hostname$shell$container$sudo$directory$git_branch$git_commit$git_state$git_status$git_metrics$package$bun$nodejs$deno$python$rust$golang$c$cmake$zig$java$kotlin$scala$swift$php$ruby$perl$lua$haskell$elixir$erlang$julia$ocaml$terraform$helm$kubernetes$docker_context$nix_shell$conda$aws$azure$gcloud$custom$memory_usage$cmd_duration$jobs$battery$time$status
[╰─](overlay0)$line_break$character"""

# Right-hand prompt (Disabled for clean, predictable cursor alignment)
right_format = """"""

