# ------------------------------------------------------------------------------
# 4. SYSTEM & IDENTITY MODULES
# ------------------------------------------------------------------------------

# Operating System Detection Module
# Renders distro/OS specific Nerd Font glyphs when running across OS environments
[os]
format = "[ $symbol]($style)"
style = "bold text"
disabled = false

[os.symbols]
Alpaquita        = "󰕈"
Alpine           = "󰕈"
Amazon           = "󰸏"
Android          = "󰀲"
Arch             = "󰣇"
Artix            = "󰣇"
CentOS           = "󰅢"
Debian           = "󰣚"
EndeavourOS      = "󰣇"
Fedora           = "󰣛"
FreeBSD          = "󰈔"
Garuda           = "󰣇"
Gentoo           = "󰣨"
Kali             = "󰈔"
Linux            = "󰌽"
Mabox            = "󱆎"
Macos            = "󰀵"
Manjaro          = "󱆎"
Mint             = "󰔡"
NixOS            = "󱄅"
OpenBSD          = "󰈔"
openSUSE         = "󰅂"
Pop              = "󰅢"
Raspbian         = "󰐿"
Redhat           = "󱄅"
RedHatEnterprise = "󱄅"
RockyLinux       = "󰅢"
SUSE             = "󰅂"
Ubuntu           = "󰕈"
Void             = "󰅢"
Windows          = "󰍲"

# Active Username Module
# Renders user identity when running over SSH or executing with elevated privileges
[username]
format = "[ $user]($style)"
style_user = "bold lavender"
style_root = "bold red"
show_always = false
disabled = false

# Remote Hostname Module
# Renders remote machine hostname when logged into an SSH session
[hostname]
format = "[@$hostname]($style)"
style = "bold lavender"
ssh_only = true
ssh_symbol = "󰣀 "
disabled = false

# Active Shell Module
# Displays a subtle icon indicating the currently active shell process
[shell]
format = "[ $symbol]($style)"
style = "bold overlay1"
bash_indicator = "󱆃"
fish_indicator = "󰈺"
zsh_indicator = "󰞷"
nu_indicator = "󰘦"
powershell_indicator = "󰨊"
cmd_indicator = "󰘦"
elvish_indicator = "󰘦"
tcsh_indicator = "󰘦"
ion_indicator = "󰘦"
xonsh_indicator = "󰘦"
disabled = false

# Container Environment Module
# Renders container name when operating inside Docker, Podman, or LXC environments
[container]
format = "[ 󰏖 $name]($style)"
style = "bold peach"
symbol = "󰏖"
disabled = false

# Sudo Execution State
# Renders a padlock icon when superuser permissions are active in current session
[sudo]
format = "[ 󰌆 ]($style)"
symbol = "󰌆"
style = "bold red"
disabled = false

# ------------------------------------------------------------------------------
# 5. DIRECTORY & NAVIGATION MODULE
# ------------------------------------------------------------------------------

# Active Workspace Directory Module
# Features smart repository root detection, fish-style path truncation,
# custom folder icon substitution, and read-only filesystem locks.
[directory]
format = " [ $path]($style)[$read_only]($read_only_style)"
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
home_symbol = "󰋜 ~"
read_only = " 󰌾"
read_only_style = "bold red"
repo_root_style = "bold mauve"
repo_root_format = " [ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
fish_style_pwd_dir_length = 1
use_os_path_sep = true
disabled = false

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰉍 Downloads"
"Music"     = "󰎈 Music"
"Pictures"  = "󰋩 Pictures"
"Videos"    = "󰕧 Videos"
"Projects"  = "󰲋 Projects"
"Developer" = "󰲋 Developer"
".config"   = "󱁤 .config"

# ------------------------------------------------------------------------------
# 6. GIT & VERSION CONTROL EXPERIENCE
# ------------------------------------------------------------------------------

# Active Git Branch Module
[git_branch]
format = " [󰘬 $branch]($style)"
symbol = "󰘬 "
style = "bold mauve"
truncation_length = 32
truncation_symbol = "…"
only_attached = false
always_show_remote = false
ignore_branches = []
disabled = false

# Git Commit Hash Module (Renders short hash and tags in detached HEAD mode)
[git_commit]
format = " [󰜘 $hash$tag]($style)"
style = "bold green"
commit_hash_length = 7
tag_symbol = " 🏷 "
tag_disabled = false
only_detached = true
disabled = false

# Git Operation State Module (Rebase, Merge, Cherry-Pick, Bisect indicators)
[git_state]
format = " [󰴈 $state($progress_current/$progress_total)]($style)"
style = "bold yellow"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
disabled = false

# Detailed Git Repository Status Indicators
[git_status]
format = " ([$all_status$ahead_behind]($style))"
style = "bold red"
stashed = " 󰏗${count}"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
conflicted = " 󰞇${count}"
deleted = " 󰅖${count}"
renamed = " 󰑕${count}"
modified = " 󰏫${count}"
staged = " 󰄬${count}"
untracked = " 󰋗${count}"
typechanged = " 󰨡${count}"
disabled = false

# Git Line Metrics Module (Renders added & deleted line diff counts)
[git_metrics]
format = " ([+$added]($added_style) [-$deleted]($deleted_style))"
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = true
disabled = false

# ------------------------------------------------------------------------------
# 7. PACKAGE MANAGERS & PROGRAMMING LANGUAGE RUNTIMES
# ------------------------------------------------------------------------------

# Package Version Module (Detects package.json, Cargo.toml, pyproject.toml, etc.)
[package]
format = " [󰏗 $version]($style)"
symbol = "󰏗 "
style = "bold peach"
display_private = true
disabled = false

# Bun JavaScript/TypeScript Runtime Engine
[bun]
format = " [󰏗 $version]($style)"
symbol = "󰏗 "
style = "bold rosewater"
detect_files = ["bun.lockb", "bun.lock"]
detect_extensions = []
disabled = false

# Node.js Runtime Engine
[nodejs]
format = " [󰎙 $version]($style)"
symbol = "󰎙 "
style = "bold green"
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_extensions = ["js", "ts", "jsx", "tsx", "mjs", "cjs"]
detect_folders = ["node_modules"]
disabled = false

# Deno Secure JS/TS Runtime Engine
[deno]
format = " [󰌞 $version]($style)"
symbol = "󰌞 "
style = "bold teal"
detect_files = ["deno.json", "deno.jsonc", "import_map.json"]
detect_extensions = []
