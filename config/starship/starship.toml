# RAM / Memory Usage Indicator (Triggers warning icon when RAM usage exceeds 75%)
[memory_usage]
format = " [󰍛 $ram]($style)"
symbol = "󰍛 "
style = "bold red"
threshold = 75
disabled = false

# Command Execution Duration (Displays elapsed runtime for commands > 2.0 seconds)
[cmd_duration]
format = " [󱎫 $duration]($style)"
min_time = 2000
show_milliseconds = false
disabled = false

# Active Background Jobs Counter
[jobs]
format = " [󰜎 $number]($style)"
symbol = "󰜎 "
style = "bold sapphire"
threshold = 1
disabled = false

# Laptop Battery Power & Level Monitor
[battery]
format = " [$symbol$percentage]($style)"
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
full_symbol = "󰁹 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
disabled = false

[[battery.display]]
threshold = 15
style = "bold red"

[[battery.display]]
threshold = 35
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# System Clock (24-hour HH:MM format)
[time]
format = " [󱑎 $time]($style)"
style = "bold overlay1"
time_format = "%R"
use_12hr = false
disabled = false

# Command Exit Code Status (Renders status code upon non-zero exit)
[status]
format = " [󰅖 $status]($style)"
symbol = "󰅖 "
success_symbol = "󰄬 "
style = "bold red"
disabled = false

# ------------------------------------------------------------------------------
# 10. CUSTOM EXTENSION MODULES
# ------------------------------------------------------------------------------
# Custom modules extend Starship with performance-tuned detectors for modern dev tools.
# Utilizing fast file & folder matching to prevent unneeded shell process spawns.

# Custom Module 1: uv (Ultra-Fast Python Package Installer)
[custom.uv]
description = "uv Python package manager"
command = "uv --version | cut -d' ' -f2"
detect_files = ["uv.lock", "pyproject.toml"]
detect_folders = [".venv"]
symbol = "⚡ "
style = "bold teal"
format = " [via $symbol$output]($style)"

# Custom Module 2: pnpm (Performant Disk-Efficient JS Package Manager)
[custom.pnpm]
description = "pnpm package manager"
command = "pnpm --version"
detect_files = ["pnpm-lock.yaml", "pnpm-workspace.yaml"]
symbol = "󰏗 "
style = "bold yellow"
format = " [via $symbol$output]($style)"

# Custom Module 3: Turborepo (High-Speed Build System for Monorepos)
[custom.turbo]
description = "Turborepo monorepo workspace"
detect_files = ["turbo.json"]
symbol = "󰚗 "
style = "bold pink"
format = " [$symbol Turborepo]($style)"

# Custom Module 4: Docker Compose Project Configuration
[custom.docker_compose]
description = "Docker Compose project indicator"
detect_files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
symbol = "󰡨 "
style = "bold blue"
format = " [$symbol Compose]($style)"

# Custom Module 5: Cargo Watch File Listener
[custom.cargo_watch]
description = "Cargo Watch background file listener"
when = "pgrep cargo-watch"
symbol = "󱘗 "
style = "bold peach"
format = " [$symbol watching]($style)"

# Custom Module 6: Cargo Nextest Fast Test Runner
[custom.cargo_nextest]
description = "Cargo Nextest test runner configuration"
detect_files = [".config/nextest.toml"]
symbol = "󱘗 "
style = "bold green"
format = " [$symbol nextest]($style)"

# Custom Module 7: Flutter Pub Package Manager Workspace
[custom.flutter_pub]
description = "Flutter Pub package workspace"
detect_files = ["pubspec.yaml"]
symbol = "󱏓 "
style = "bold sky"
format = " [$symbol Flutter]($style)"

# Custom Module 8: Expo React Native Platform
[custom.expo]
description = "Expo React Native application"
detect_files = ["app.json", "expo-env.d.ts"]
symbol = "󰅴 "
style = "bold text"
format = " [$symbol Expo]($style)"

# Custom Module 9: Cloudflare Wrangler Deployment CLI
[custom.wrangler]
description = "Cloudflare Wrangler deployment config"
detect_files = ["wrangler.toml", "wrangler.json"]
symbol = "󰅟 "
style = "bold peach"
format = " [$symbol Wrangler]($style)"

# Custom Module 10: Cloudflare Edge Workers & Pages
[custom.cloudflare]
description = "Cloudflare serverless edge platform"
detect_files = ["_routes.json", "wrangler.toml"]
symbol = "󰅟 "
style = "bold peach"
format = " [$symbol Cloudflare]($style)"

# Custom Module 11: Supabase Backend Stack
[custom.supabase]
description = "Supabase backend stack"
detect_folders = ["supabase"]
detect_files = ["supabase/config.toml"]
symbol = "󱤅 "
style = "bold green"
format = " [$symbol Supabase]($style)"

# Custom Module 12: Rclone Active Sync Monitor
[custom.rclone]
description = "Rclone active file synchronization"
when = "pgrep rclone"
symbol = "󰋊 "
style = "bold sky"
format = " [$symbol rclone active]($style)"

# Custom Module 13: Pulumi Infrastructure as Code
[custom.pulumi]
description = "Pulumi infrastructure management"
detect_files = ["Pulumi.yaml", "Pulumi.dev.yaml"]
symbol = "󰌠 "
style = "bold mauve"
format = " [$symbol Pulumi]($style)"

# ------------------------------------------------------------------------------
# 11. PROMPT CHARACTER & INTERACTIVE EXIT STATES
# ------------------------------------------------------------------------------

# Main Prompt Character Module
# Dynamically alters shape and color according to exit code & Vi modal status
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"
disabled = false
