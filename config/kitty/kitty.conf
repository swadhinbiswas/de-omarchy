# kitty — Rosé Pine Moon (theme applied 2026-08; previously Dracula)
# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Background Opacity
background_opacity 0.8

# Use zsh shell
shell zsh

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# ---- Rosé Pine Moon (https://rosepinetheme.com) ----
foreground              #e0def4
background              #232136
selection_foreground    #232136
selection_background    #44415a

# Cursor colors
cursor                  #e0def4
cursor_text_color       #232136

# URL underline color when hovering with mouse
url_color               #9ccfd8

# Kitty window border colors
active_border_color     #ea9a97
inactive_border_color   #393552
bell_border_color       #f6c177

# Tab bar colors
active_tab_foreground   #232136
active_tab_background   #ea9a97
inactive_tab_foreground #e0def4
inactive_tab_background #393552
tab_bar_background      #232136

# The 16 terminal colors (Rosé Pine Moon ANSI map)

# black
color0 #393552
color8 #6e6a86

# red
color1 #eb6f92
color9 #eb6f92

# green
color2  #3e8fb0
color10 #9ccfd8

# yellow
color3  #f6c177
color11 #f6c177

# blue
color4  #c4a7e7
color12 #c4a7e7

# magenta
color5  #ea9a97
color13 #ea9a97

# cyan
color6  #9ccfd8
color14 #9ccfd8

# white
color7  #e0def4
color15 #e0def4

# ---- state-of-the-art polish ----
# New windows appear centered instead of next-to-arbitrary
placement_strategy center

# Inner padding for a roomier, modern look (margins stay 21.75)
window_padding_width 6

# Powerline-style tab bar using the Rosé Pine colors above
tab_bar_style powerline

# Dim the (transparent) background behind text for readability
background_tint 0.6

# ---- scrollback & copy (TUI-first ergonomics) ----
scrollback_lines 10000
wheel_scroll_multiplier 4.0
map kitty_mod+up scroll_line_up
map kitty_mod+down scroll_line_down
map kitty_mod+g scroll_end
map kitty_mod+shift+g scroll_start
map kitty_mod+h show_scrollback

# vi-style copy: select with h/j/k/l, y to copy (vi mode)
map kitty_mod+v copy_to_clipboard
map kitty_mod+shift+v paste_from_clipboard
mouse_hide_wait 2.0

# ---- font & rendering ----
disable_ligatures never
font_features none
adjust_line_height 0

# ---- tabs (keyboard-first) ----
map ctrl+shift+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+q close_tab

# ---- window layout ----
map kitty_mod+l next_layout
map ctrl+shift+enter new_window
map kitty_mod+shift+enter new_window_with_cwd

# ---- hints: open URLs / files with the keyboard ----
map ctrl+shift+o kitten hints --type path --program @
map ctrl+shift+u kitten hints --type url

# ---- bell ----
bell_on_tab false
visual_bell_duration 0.2
